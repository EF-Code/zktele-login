services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: zktele
      POSTGRES_USER: zktele_migrate
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zktele_migrate -d zktele"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - zktele-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://zktele_migrate:local-development-only@postgres:5432/zktele
      DATABASE_SSL: "false"
    command: ["npm", "run", "migrate"]

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      SERVICE_ROLE: combined
      ENVIRONMENT_ID: compose
      APP_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://zktele_migrate:local-development-only@postgres:5432/zktele
      DATABASE_SSL: "false"
      ALLOW_DEV_INIT: "true"
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - "3000:3000"

volumes:
  zktele-postgres:
